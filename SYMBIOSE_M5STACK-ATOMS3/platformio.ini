; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; ── ATOMS3 ──────────────────────────────────────────────
[env:m5stack-atoms3]
platform = espressif32
board = m5stack-atoms3
framework = arduino
monitor_speed = 115200
build_flags =
   -DARDUINO_USB_CDC_ON_BOOT=1   ; activer le CDC USB au démarrage
   -DARDUINO_USB_MODE=0          ; CDC USB en mode périphérique (comme un Arduino Leonardo/Micro classique)
build_src_filter = +<main_atoms3.cpp>   ; compiler uniquement le fichier ATOMS3
lib_deps =
    MicroOsc
    M5Unified
    M5_PbHub

; ── ATOM (PbHub + Units) ────────────────────────────────
[env:m5stack-atom]
platform = espressif32
board = m5stack-atom
framework = arduino
monitor_speed = 115200
build_src_filter = +<main_atom.cpp>
lib_deps =
    MicroOsc
    M5Unified
    M5_PbHub

; ── NANO (Joystick) ────────────────────────────────────
[env:nanoatmega328]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 115200
build_src_filter = +<main_nano.cpp>
lib_deps =
    MicroOsc